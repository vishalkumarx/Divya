<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Dr. Divya Sharma</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Poppins',sans-serif; background:#fff8fb; color:#444; line-height:1.6; }

nav { display:flex; justify-content:space-between; align-items:center; padding:18px 8%; background:#ffe6f2; }
nav h2 { font-family:'Playfair Display',serif; color:#c76aa4; }

.container { max-width: 1000px; margin: 50px auto; padding: 0 20px; }

/* Login Form Styles */
#login-section {
  max-width: 400px;
  margin: 100px auto;
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.05);
  text-align: center;
}
#login-section h2 { color: #c76aa4; font-family: 'Playfair Display', serif; margin-bottom: 20px; }
input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-family: 'Poppins', sans-serif;}
button { width: 100%; background: #f4a7c5; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 16px; margin-top: 10px; font-weight: 500;}
button:hover { background: #d87cab; }

/* Dashboard Styles */
#dashboard-section { display: none; }
.dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
.dashboard-header h1 { color: #c76aa4; font-family: 'Playfair Display', serif; }
#logout-btn { background: #ddd; color: #333; width: auto; padding: 8px 20px; }
#logout-btn:hover { background: #ccc; }

table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #ffe6f2; color: #c76aa4; font-weight: 600; }
tr:last-child td { border-bottom: none; }
.btn-delete { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; width: auto; margin:0;}
.btn-delete:hover { background: #cc0000; }

.empty-state { text-align: center; padding: 50px; color: #888; }

/* Tabs Styles */
.tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 2px solid #ffe6f2; padding-bottom: 10px; }
.tab-btn { background: none; border: none; color: #888; font-size: 18px; font-weight: 500; cursor: pointer; padding: 8px 15px; margin: 0; width: auto; font-family: 'Poppins', sans-serif;}
.tab-btn.active { color: #c76aa4; border-bottom: 3px solid #c76aa4; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Image Manager Styles */
.image-upload-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
.image-upload-card select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-family: 'Poppins', sans-serif;}
.image-upload-card input[type="file"] { margin: 10px 0; }
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.image-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }
.image-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
.image-card .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; background: #ffe6f2; color: #c76aa4; font-weight: 600; margin-bottom: 10px; }
</style>
</head>
<body>

<nav>
<h2>Admin Panel</h2>
<a href="index.html" style="text-decoration:none; color:#c76aa4; font-weight:500;">Back to Site</a>
</nav>

<div class="container">
  
  <!-- LOGIN SCREEN -->
  <div id="login-section">
    <h2>Doctor Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Log In</button>
      <p id="login-error" style="color:red; font-size:14px; margin-top:10px; display:none;">Invalid credentials</p>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-section">
    <div class="dashboard-header">
      <h1>Admin Dashboard</h1>
      <button id="logout-btn">Log Out</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('appointments')">Appointments</button>
      <button class="tab-btn" onclick="switchTab('images')">Image Manager</button>
    </div>

    <!-- Appointments Tab Content -->
    <div id="appointments-tab" class="tab-content active">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Mode</th>
            <th>Email</th>
            <th>Message</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="appointments-list">
          <!-- Data populated by JS -->
        </tbody>
      </table>
    </div>

    <!-- Images Tab Content -->
    <div id="images-tab" class="tab-content">
      <div class="image-upload-card">
        <h3>Upload New Image</h3>
        <select id="image-section" required>
          <option value="" disabled selected>Select Website Section</option>
          <option value="hero">Hero Section (1 Image)</option>
          <option value="about">About Section (Multiple Images)</option>
          <option value="testimonial">Testimonials (Multiple Images)</option>
        </select>
        <input type="file" id="image-file" accept="image/*" required>
        <button id="upload-image-btn" style="width: auto; padding: 10px 25px;">Upload Image</button>
        <p id="upload-status" style="font-size: 14px; margin-top: 10px;"></p>
      </div>

      <h3>Manage Uploaded Images</h3>
      <div class="image-grid" id="image-grid">
        <!-- populated by JS -->
      </div>
    </div>

  </div>

</div>

<!-- SUPABASE SDK -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  // Initialize Supabase (User placeholders)
  const SUPABASE_URL = 'https://uuuxprwukdgqnkuqcviw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1dXhwcnd1a2RncW5rdXFjdml3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwODM4NTksImV4cCI6MjA5MTY1OTg1OX0.LtDv4KsbS2bYKifSMIWHW1Gkdm_xkJy0OfxDUKwPr08';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Tab switching logic
  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(tabId + '-tab').classList.add('active');

    if(tabId === 'images') {
      fetchImages();
    }
  }

  // Upload Logic
  document.getElementById('upload-image-btn').addEventListener('click', async () => {
    const fileInput = document.getElementById('image-file');
    const sectionSelect = document.getElementById('image-section');
    const statusText = document.getElementById('upload-status');
    
    if(!fileInput.files.length || !sectionSelect.value) {
      statusText.innerText = "Please select a file and section.";
      statusText.style.color = "red";
      return;
    }

    if(SUPABASE_URL === 'YOUR_SUPABASE_URL') {
      statusText.innerText = "Error: Please replace YOUR_SUPABASE_URL and YOUR_SUPABASE_ANON_KEY in admin.html.";
      statusText.style.color = "red";
      return;
    }

    const file = fileInput.files[0];
    const fileExt = file.name.split('.').pop();
    const fileName = `${Math.random()}.${fileExt}`;
    const filePath = `${sectionSelect.value}/${fileName}`;

    statusText.innerText = "Uploading...";
    statusText.style.color = "blue";
    document.getElementById('upload-image-btn').disabled = true;

    try {
      // 1. Upload to Storage
      const { data: uploadData, error: uploadError } = await supabase.storage
        .from('website-images')
        .upload(filePath, file);

      if(uploadError) throw uploadError;

      // 2. Get Public URL
      const { data: publicUrlData } = supabase.storage
        .from('website-images')
        .getPublicUrl(filePath);

      const publicUrl = publicUrlData.publicUrl;

      // 3. Save to Database
      const { error: dbError } = await supabase
        .from('site_images')
        .insert([{ section: sectionSelect.value, storage_path: filePath, image_url: publicUrl }]);

      if(dbError) throw dbError;

      statusText.innerText = "Image uploaded successfully!";
      statusText.style.color = "green";
      fileInput.value = '';
      fetchImages(); // Refresh grid layout

    } catch (err) {
      console.error(err);
      statusText.innerText = "Upload failed: " + err.message;
      statusText.style.color = "red";
    } finally {
      document.getElementById('upload-image-btn').disabled = false;
    }
  });

  // Fetch Logic
  async function fetchImages() {
    const grid = document.getElementById('image-grid');
    grid.innerHTML = '<p class="empty-state">Loading images...</p>';

    if(SUPABASE_URL === 'YOUR_SUPABASE_URL') {
      grid.innerHTML = '<p class="empty-state">Supabase credentials not configured.</p>';
      return;
    }

    try {
      const { data: images, error } = await supabase
        .from('site_images')
        .select('*')
        .order('created_at', { ascending: false });
        
      if(error) throw error;

      if(!images || images.length === 0) {
        grid.innerHTML = '<p class="empty-state">No images uploaded yet.</p>';
        return;
      }

      grid.innerHTML = '';
      images.forEach(img => {
        const div = document.createElement('div');
        div.className = 'image-card';
        div.innerHTML = `
          <div class="badge">${img.section.toUpperCase()}</div>
          <img src="${img.image_url}" alt="Uploaded image">
          <button class="btn-delete" style="width:100%" onclick="deleteImage('${img.id}', '${img.storage_path}')">Delete</button>
        `;
        grid.appendChild(div);
      });
    } catch (err) {
      grid.innerHTML = '<p class="empty-state">Error loading images.</p>';
      console.error(err);
    }
  }

  // Delete Logic
  window.deleteImage = async (id, storagePath) => {
    if(!confirm("Are you sure you want to delete this image?")) return;

    try {
      // Delete from DB
      await supabase.from('site_images').delete().eq('id', id);
      // Delete from Storage
      await supabase.storage.from('website-images').remove([storagePath]);
      
      fetchImages(); // Refresh
    } catch (err) {
      alert("Error deleting image: " + err.message);
    }
  };
</script>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBngSBXsPLwUzxRTuQ776GsE73AvKcMrAI",
    authDomain: "divya-911ff.firebaseapp.com",
    projectId: "divya-911ff",
    storageBucket: "divya-911ff.firebasestorage.app",
    messagingSenderId: "354737337234",
    appId: "1:354737337234:web:3b428924a10a34d60f074b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginSection = document.getElementById('login-section');
  const dashboardSection = document.getElementById('dashboard-section');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('login-error');
  const logoutBtn = document.getElementById('logout-btn');
  const appointmentsList = document.getElementById('appointments-list');

  // Monitor Auth State
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginSection.style.display = 'none';
      dashboardSection.style.display = 'block';
      fetchAppointments();
    } else {
      loginSection.style.display = 'block';
      dashboardSection.style.display = 'none';
      appointmentsList.innerHTML = '';
    }
  });

  // Login Function
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
      loginError.style.display = 'none';
    } catch (error) {
      loginError.style.display = 'block';
      loginError.innerText = error.message;
    }
  });

  // Logout Function
  logoutBtn.addEventListener('click', () => {
    signOut(auth);
  });

  // Fetch Data Function
  async function fetchAppointments() {
    appointmentsList.innerHTML = '<tr><td colspan="7" class="empty-state">Loading appointments...</td></tr>';
    
    try {
      const q = query(collection(db, "appointments"), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q);
      
      if (querySnapshot.empty) {
        appointmentsList.innerHTML = '<tr><td colspan="7" class="empty-state">No appointments found.</td></tr>';
        return;
      }

      appointmentsList.innerHTML = '';
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const date = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'N/A';
          const sessionMode = data.sessionType || 'Not Specified';
          const phone = data.phone || 'N/A';
          
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${date}</td>
            <td><strong>${data.name}</strong></td>
            <td>${phone}</td>
            <td><span style="padding:4px 10px; border-radius:12px; font-size:12px; background:${sessionMode === 'Online' ? '#e0f2fe' : '#fef3c7'}; color:${sessionMode === 'Online' ? '#0369a1' : '#b45309'}; font-weight:600;">${sessionMode}</span></td>
            <td><a href="mailto:${data.email}" style="color:#c76aa4;">${data.email}</a></td>
            <td style="max-width:250px;">${data.message}</td>
            <td><button class="btn-delete" data-id="${docSnap.id}">Delete</button></td>
          `;
          appointmentsList.appendChild(tr);
        });

      // Attach delete listeners
      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.getAttribute('data-id');
          if(confirm('Are you sure you want to delete this booking?')) {
            await deleteDoc(doc(db, "appointments", id));
            fetchAppointments(); // refresh list
          }
        });
      });

    } catch (error) {
      console.error("Error fetching data:", error);
      appointmentsList.innerHTML = '<tr><td colspan="7" class="empty-state" style="color:red;">Error loading data. Check console.</td></tr>';
    }
  }

</script>
</body>
</html>
