<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazfit Bip 6 Watch Face</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap');

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1a1a1a;
      font-family: 'Roboto', sans-serif;
    }

    .watch-case {
      width: 320px;
      height: 400px;
      background: #000;
      border-radius: 40px;
      border: 12px solid #2a2a2a;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      /* Subtle grid background */
      background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: center;
    }

    .date {
      color: #00ffff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .time-container {
      display: flex;
      align-items: baseline;
      margin-top: 5px;
    }

    .time {
      font-family: 'Orbitron', sans-serif;
      font-size: 72px;
      font-weight: 700;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      line-height: 1;
    }

    .ampm {
      color: #ff00ff;
      font-weight: 700;
      font-size: 16px;
      margin-left: 5px;
      text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
    }

    .activity-ring {
      position: relative;
      width: 140px;
      height: 140px;
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    svg {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg);
      width: 140px;
      height: 140px;
    }

    circle {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .bg-circle {
      stroke: rgba(0, 255, 255, 0.1);
    }

    .progress-circle {
      stroke: #00ffff;
      stroke-dasharray: 377; /* 2 * pi * r (r=60) */
      stroke-dashoffset: 94; /* 75% complete */
      filter: drop-shadow(0 0 5px rgba(0,255,255,0.8));
    }

    .steps-icon {
      color: #00ffff;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .steps-count {
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }

    .steps-label {
      color: #00ffff;
      font-size: 12px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: auto;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .stat {
      display: flex;
      align-items: center;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
    }

    .stat i {
      margin-right: 5px;
    }

    .heart-icon {
      color: #ff00ff;
      text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
      animation: pulse 1s infinite alternate;
    }

    .battery-icon {
      color: #00ffff;
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
    }
    
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="watch-case">
    <div class="date" id="dateDisplay">MON, OCT 21, 2024</div>
    
    <div class="time-container">
      <div class="time" id="timeDisplay">10:09</div>
      <div class="ampm" id="ampmDisplay">AM</div>
    </div>

    <div class="activity-ring">
      <svg>
        <circle class="bg-circle" cx="70" cy="70" r="60"></circle>
        <circle class="progress-circle" cx="70" cy="70" r="60"></circle>
      </svg>
      <i class="fa-solid fa-shoe-prints steps-icon"></i>
      <div class="steps-count">8,452</div>
      <div class="steps-label">steps</div>
    </div>

    <div class="stats-row">
      <div class="stat">
        <i class="fa-solid fa-heart heart-icon"></i>
        <span>78 BPM</span>
      </div>
      <div class="stat">
        <i class="fa-solid fa-battery-three-quarters battery-icon"></i>
        <span>64%</span>
      </div>
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      
      // Update Date
      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', options).toUpperCase();
      
      // Update Time
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      hours = hours % 12;
      hours = hours ? hours : 12; // the hour '0' should be '12'
      minutes = minutes < 10 ? '0' + minutes : minutes;
      
      document.getElementById('timeDisplay').textContent = hours + ':' + minutes;
      document.getElementById('ampmDisplay').textContent = ampm;
    }
    
    // Initial call
    updateTime();
    
    // Update every minute
    setInterval(updateTime, 60000);
  </script>
</body>
</html>
